name: Compilar .exe para Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Crear ejecutable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name AnotadorImagenes anotador.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnotadorImagenes-windows
          path: dist/AnotadorImagenes.exe
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anotador-v${{ github.run_number }}
          name: Anotador de Imágenes (versión ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descarga **AnotadorImagenes.exe** y ábrelo con doble clic (no necesita instalación).
            Si Windows muestra "Windows protegió su PC", pulsa *Más información* → *Ejecutar de todas formas*.
          files: dist/AnotadorImagenes.exe
