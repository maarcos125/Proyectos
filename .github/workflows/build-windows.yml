name: Compilar .exe para Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Crear ejecutable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name AnotadorImagenes anotador.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnotadorImagenes-windows
          path: dist/AnotadorImagenes.exe
